# Included in EVERY location: an add_header inside a location block discards the
# server-level ones, so they can't just be declared once at the top.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# "Sign in with Google" opens a popup that must be able to report back to this page.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
# Thumbnails come from Instagram/YouTube/TikTok CDNs, hence img-src https:.
# accounts.google.com/gsi/ is Google's sign-in button (loaded only on the sign-in sheet).
add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://accounts.google.com/gsi/; font-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# Browsers ignore this on plain http (local testing), and enforce HTTPS once they've seen the site over HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
