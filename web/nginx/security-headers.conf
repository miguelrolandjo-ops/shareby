# Included in EVERY location: an add_header inside a location block discards the
# server-level ones, so they can't just be declared once at the top.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Thumbnails come from Instagram/YouTube/TikTok CDNs, hence img-src https:.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# Behind HTTPS (required in production for the service worker), also add:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
