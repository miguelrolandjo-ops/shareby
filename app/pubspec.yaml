name: shareby
description: Save links from any app into collections and share boards with friends. Offline-first.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0          # Flutter 3.27+

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:     # Material's own labels (copy/paste, dialogs) in Indonesian
    sdk: flutter
  provider: ^6.1.2           # app state (ChangeNotifier)
  sqflite: ^2.4.1            # on-device database: the offline source of truth
  path: ^1.9.0
  shared_preferences: ^2.3.3 # small flags: session, sync cursor, first-run seed
  http: ^1.2.2               # REST calls to the Shareby API (-> Supabase PostgreSQL)
  uuid: ^4.5.1               # IDs are created on the device so saves work offline
  url_launcher: ^6.3.1       # open a saved link
  path_provider: ^2.1.5      # where the saved thumbnails live
  image: ^4.5.4              # shrinks a link's picture to a small JPEG kept on the device
  google_sign_in: ^7.2.0     # "Continue with Google": ID token for the API (Credential Manager on Android)
  flutter_secure_storage: ^10.0.0  # the session token, in Android Keystore / iOS Keychain

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/rules.json        # platform + title rules; a newer copy is fetched from the server
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
