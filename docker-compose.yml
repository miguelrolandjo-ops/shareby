# Full stack: PostgreSQL + API + web (Nginx).
#   docker compose up --build
#   web:  http://localhost:8000      (the phone app can use http://10.0.2.2:8000/api)
#   api:  http://localhost:8080      (direct, for the phone app's default config)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shareby
      POSTGRES_PASSWORD: shareby
      POSTGRES_DB: shareby
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shareby"]
      interval: 3s
      retries: 20

  api:
    build: ./server
    environment:
      DATABASE_URL: postgres://shareby:shareby@db:5432/shareby
      ALLOW_DEV_AUTH: ${ALLOW_DEV_AUTH:-true}   # set to false in production
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "8000:80"
    depends_on:
      - api

volumes:
  pgdata:
